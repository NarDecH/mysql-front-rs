[package]
name = "mff-cli"
description = "Command-line client for mysql-front-rs: execute, export and import"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "mff-cli"
path = "src/main.rs"

[dependencies]
mff-core = { path = "../mff-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
